# MAPIMS Employee Feedback System (EFS) — Docker stack for the shared VPS.
#
# Other feedback stacks run on the same server (e.g. project "apdch_pfs" on slot 7, and "pfs").
# Every name, port and volume here is distinct so `docker compose up` never touches them.
#
# Host ports follow the server's 100N / 200N / 300N scheme, slot 8.
# CONFIRM slot 8 is free on the VPS before the first `docker compose up`; change the three
# numbers below (and nginx/efs.mapims.edu.in.conf) if it is taken.
#   1008 → frontend (SPA + /api proxied to the backend); host nginx serves the domain from here
#   2008 → backend API, localhost only (debugging from the VPS)
#   3008 → MongoDB, localhost only (mongosh / backups from the VPS)
# Volumes are prefixed with the project name: mapims_efs_mongo_data, mapims_efs_uploads_data.

name: mapims_efs

services:
  mongodb:
    image: mongo:7
    container_name: mapims_efs_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3008:27017"
    environment:
      TZ: Asia/Kolkata
      MONGO_INITDB_DATABASE: mapims_efs
    volumes:
      - mongo_data:/data/db
    networks:
      - net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mapims_efs_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:2008:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongodb:27017/mapims_efs
      # TMS integration — leave unset if you don't want forwarding to TMS.
      # If both stacks share a Docker network, use http://tms_backend:5000.
      TMS_API_URL: ${TMS_API_URL:-}
      TMS_EMP_ID: ${TMS_EMP_ID:-}
      TMS_PASSWORD: ${TMS_PASSWORD:-}
      TMS_FEEDBACK_DEPARTMENT_ID: ${TMS_FEEDBACK_DEPARTMENT_ID:-}
      TMS_FEEDBACK_CATEGORY_ID: ${TMS_FEEDBACK_CATEGORY_ID:-}
      TMS_FEEDBACK_SUBCATEGORY_ID: ${TMS_FEEDBACK_SUBCATEGORY_ID:-}
      TMS_FEEDBACK_PRIORITY: ${TMS_FEEDBACK_PRIORITY:-}
      TMS_CLIENT_URL: ${TMS_CLIENT_URL:-}
    # Create backend/.env on the server from backend/.env.example (secrets, OPENROUTER_API_KEY, TMS_*, etc.)
    env_file:
      - ./backend/.env
    volumes:
      # Persistent voice/bot recordings — survives container rebuilds.
      - uploads_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mapims_efs_frontend
    restart: unless-stopped
    ports:
      - "1008:80"
    depends_on:
      - backend
    networks:
      - net

volumes:
  mongo_data:
  uploads_data:

networks:
  net:
    driver: bridge
